# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: caswam_acthist
  - _self_

# dataloading
batch_size: 32
num_workers: 7

model:
  mot_checkpoint_mixed_attn: true

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 2e-4
num_epochs: 5
max_steps: null
log_every: 5
save_every: 200
eval_every: 10

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

# wandb
wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: caswam_acthist_libero_uncond_2cam224_2e-4
  group: null
  mode: online
