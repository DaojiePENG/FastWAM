# @package _global_
# Reuse this task config for evaluation so action infer_shift stays at 0.5.

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_optional_idm
  - _self_

batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  action_scheduler:
    train_shift: 0.5
    infer_shift: 0.5

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
