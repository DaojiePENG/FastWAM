# @package _global_
defaults:
  - override /data: libero_spatial_cloudedge
  - override /model: leapbotce
  - _self_
batch_size: 2
num_workers: 4
learning_rate: 1e-4
num_epochs: 10
max_steps: 10000
log_every: 10
save_every: 500
eval_every: 0
gradient_accumulation_steps: 4
keep_last_checkpoints: 1
weight_decay: 1e-2
resume: null
model:
  cloudedge:
    # Resolve to half of max_steps in LeapBotCE.set_training_step.
    stale_loss_warmup_steps: -1
wandb:
  project: leapbotce
  name: libero_spatial_leapbotce
MULTIRUN:
  evaluator_script: experiments/libero/eval_libero_cloudedge.py
  task_suite_names: [libero_spatial]
