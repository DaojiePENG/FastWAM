# @package _global_

defaults:
  - override /data: robotwin
  - override /model: caswam
  - _self_

# dataloading
batch_size: 16
num_workers: 7

model:
  mot_checkpoint_mixed_attn: false
  # --- ActionDiT fine-tuning scope (override model YAML default) ---
  # 0 = modulation-only (safe), 6-12 = more trainable capacity
  n_unfrozen_ffn_layers: 6
  fastwam_pretrained_path: checkpoints/fastwam_release/robotwin_uncond_3cam_384.pt

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 2
max_steps: null
log_every: 5
save_every: 100
eval_every: 10

# training
gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null

# wandb
wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: caswam_robotwin_uncond_3cam_384_1e-4
  group: null
  mode: online
