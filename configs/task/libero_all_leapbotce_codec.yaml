# @package _global_
defaults:
  - override /data: libero_all_cloudedge
  - override /model: leapbotce
  - _self_

# LeapBotCE with the cloud planning codec + wide edge prefix (select mode),
# trained from the FastWAM official LIBERO checkpoint.  Ablation counterpart
# of the frozen-cloud `libero_all_leapbotce` runs (kv_adapter/kv_codec off).
#
# Optimization recipe mirrors the h200-proven configuration: 8 GPUs x
# batch_size 16 = effective batch 128, lr 2.8e-4 (sqrt-batch scaling), full
# cosine anneal.  24951 steps = 10 epochs at that effective batch.
batch_size: 16
num_workers: 8
learning_rate: 2.8e-4
lr_scheduler_type: cosine
num_epochs: 10
max_steps: 24951
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
keep_last_checkpoints: 1
weight_decay: 1.0e-2
resume: null
seed: 42
model:
  cloudedge:
    # Resolve to half of max_steps in LeapBotCE.set_training_step.
    stale_loss_warmup_steps: -1
    # Cloud payload: 30-layer 98-token cache -> 7x8 = 56 planning tokens.
    # Ablation switch: use_kv_decoder=true decouples K from V at the edge
    # (same transmitted payload z).  A4 (edge contribution) is an eval-time
    # override: model.cloudedge.edge_prefix_enabled=false.
    kv_codec:
      enabled: true
      pool_grid: [7, 8]
      use_kv_decoder: false
  edge_vision:
    # CLS + top-4 patches per view -> 2 views x 5 = 10 prefix tokens
    # (~10% of the per-layer KV budget beside 56 cloud + 32 action tokens).
    mode: select
    tokens_per_view: 5
wandb:
  project: leapbotce
  name: libero_all_leapbotce_codec
MULTIRUN:
  evaluator_script: experiments/libero/eval_libero_cloudedge.py
  task_suite_names: [libero_spatial, libero_object, libero_goal, libero_10]
