# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: caswam
  - _self_

# dataloading
batch_size: 16
num_workers: 7

model:
  mot_checkpoint_mixed_attn: true

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 5
max_steps: null
log_every: 5
save_every: 200
eval_every: 10

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null

# wandb
wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: caswam_libero_uncond_2cam224_5e-5
  group: null
  mode: online
