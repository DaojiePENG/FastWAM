_target_: fastwam.models.wan22.leapbotce_edge_train_factory.create_leapbotce
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: false
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
action_dit_pretrained_path: /mnt/c2-worldmodel/2653853/leapbot-ce/checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

edge_vision:
  model_name: vit_base_patch16_siglip_224
  num_views: 2
  pretrained: true
  freeze: true
  checkpoint_path: /mnt/c2-worldmodel/2653853/leapbot-ce/checkpoints/siglip-base/model.safetensors
  # "pooled": both views -> one context token (legacy frozen-cloud recipe).
  # "select": prefix tokens per view -> per-layer prefix K/V beside the cloud
  # tokens (works with the full cache or the compressed planning tokens).
  mode: pooled
  tokens_per_view: 5
  # How select mode picks per-view patch tokens: "topk" = most CLS/reference-
  # similar (semantic), "grid" = uniformly spaced (geometry coverage, A3).
  selection: topk
cloudedge:
  stale_loss_lambda_max: 0.5
  stale_loss_warmup_steps: 1000
  # Optional cloud-to-edge representation adapter.  It is zero-initialized,
  # so enabling it starts from the frozen-cloud baseline.
  kv_adapter:
    enabled: false
    rank: 64
    dropout: 0.0
  # Optional planning codec: compresses the 30-layer cache into
  # pool_grid[0] * pool_grid[1] planning tokens (the cloud-to-edge payload).
  # LIBERO token grid is 7x14; pool to 7x8=56.  RoboTwin grid is 12x10;
  # override pool_grid there (e.g. [6, 10]=60).
  kv_codec:
    enabled: false
    pool_grid: [7, 8]
    bottleneck_dim: 1024
    use_kv_decoder: false
    decoder_rank: 256
    dropout: 0.0
  # A4 ablation switch: set false (e.g. at eval time) to drop the edge prefix
  # K/V and fall back to cloud-only attention.  Training keeps it on unless
  # explicitly overridden.
  edge_prefix_enabled: true

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler: {train_shift: 5.0, infer_shift: 5.0, num_train_timesteps: 1000}
action_scheduler: {train_shift: 1.0, infer_shift: 1.0, num_train_timesteps: 1000}
loss: {lambda_video: 0.0, lambda_action: 1.0}
