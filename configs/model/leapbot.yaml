_target_: leapbot_va.runtime.create_leapbot
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# Train separate checkpoints for each mode; do not change this within a run.
causal_mode: interleaved
exit_depths: [8, 16, 24, 30]
training_exit_depths: [30]
# Runtime-isomorphic training replays the exact recent real-data window and
# keeps every K/V tensor inside that bounded window attached for full BPTT.
history_training_mode: strict_replay_window_bptt
history_window_blocks: 8
# Strict BF16 parity requires the same batch-one T=1 VAE call used at rollout.
history_vae_batch_chunk_size: 1
# These values define the learned local/absolute action clock and are persisted
# in every LeapBot checkpoint. Evaluation is rejected if either value changes.
replan_steps: 10
action_horizon: 32
# 32 controls at a 4:1 action/video ratio correspond to 9 physical frames,
# which the Wan VAE compresses to one real plus two future latent frames.
num_video_frames: 9

# LingBot-VA teacher forcing: ActionDiT reads a separate future-video condition
# branch. Half the conditions are clean GT and half use high-noise GT. At
# rollout, -1 fully denoises the future video before caching its transient K/V.
future_video_conditioning: lingbot_teacher_forced_v1
future_video_condition_noise_probability: 0.5
future_video_condition_min_u: 0.5
future_video_condition_max_u: 1.0
# Stabilize the pretrained H0 factorization before introducing near-pure-noise
# video conditions. This is a data curriculum, not an attention gate.
future_video_condition_clean_warmup_steps: 200
future_video_condition_noise_ramp_steps: 800
future_video_denoise_steps: -1

# The formal post-training run overrides this to video_lora_action_full.
training_strategy: full_dit
video_lora:
  enabled: false
  rank: 16
  alpha: 16.0
  dropout: 0.0
  learning_rate_multiplier: 1.0

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
