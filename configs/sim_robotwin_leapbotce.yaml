# @package _global_

# LeapBotCE variant of sim_robotwin.yaml. The RoboTwin eval entrypoint spawns
# the official RoboTwin script/eval_policy.py, which re-composes a sim cfg
# inside the policy package from `sim_cfg_path` + `sim_task` only — CLI
# `model.*` overrides on the outer hydra command never reach it. Everything
# the LeapBotCE policy needs must therefore be pinned in this file:
#   - task choice -> the leapbotce model/data pair (robotwin_all_leapbotce)
#   - load_text_encoder: eval prompts (10 seen task instructions) are not in
#     the training-side text-embed cache, so T5 must load in-process
#   - skip_dit_load_from_pretrain: false — leapbotce checkpoints are deltas;
#     the frozen Wan2.2 base must load from the configured local paths
#   - EVALUATION.action_horizon: 32 — the trained chunk length; leaving it
#     null would fall back to num_frames-1 = 52.

defaults:
  - train
  - override /task: robotwin_all_leapbotce
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: false
  # Local Wan-AI layout keeps the original .pth T5/VAE files; the
  # DiffSynth-Studio safetensors redirect would look for files that do not
  # exist locally (and .pth content cannot be loaded as safetensors).
  redirect_common_files: false

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: leapbotce_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: 32
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
