train:
  _target_: fastwam.datasets.lerobot.cloudedge_robot_video_dataset.CloudEdgeRobotVideoDataset
  # Full LIBERO recipe: all four no-noops suites in one training set, matching
  # the released FastWAM libero_uncond_2cam224_1e-4 checkpoint configuration.
  dataset_dirs: [
    /mnt/c2-worldmodel/training_data/LIBERO-fastwam/libero_spatial_no_noops_lerobot,
    /mnt/c2-worldmodel/training_data/LIBERO-fastwam/libero_object_no_noops_lerobot,
    /mnt/c2-worldmodel/training_data/LIBERO-fastwam/libero_goal_no_noops_lerobot,
    /mnt/c2-worldmodel/training_data/LIBERO-fastwam/libero_10_no_noops_lerobot,
  ]
  max_delay_steps: 20
  action_horizon: 32
  # num_frames is derived automatically as max_delay_steps + action_horizon
  # (rounded to a multiple of four) + 1 by CloudEdgeRobotVideoDataset.
  shape_meta:
    images:
      - {key: image, raw_shape: [3, 512, 512], shape: [3, 224, 224]}
      - {key: wrist_image, raw_shape: [3, 512, 512], shape: [3, 224, 224]}
    action:
      - {key: default, raw_shape: 7, shape: 7}
    state:
      - {key: default, raw_shape: 8, shape: 8}
  global_sample_stride: 1
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: /mnt/c2-worldmodel/2638088/fastwam/fastwam_release/libero_uncond_2cam224_dataset_stats.json
  skip_padding_as_possible: true
  concat_multi_camera: horizontal
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: 65
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - {_target_: fastwam.datasets.lerobot.transforms.image.ToTensor}
      - {_target_: torchvision.transforms.Resize, size: [224, 224]}
    val_transforms:
      - {_target_: fastwam.datasets.lerobot.transforms.image.ToTensor}
      - {_target_: torchvision.transforms.Resize, size: [224, 224]}
  text_embedding_cache_dir: /mnt/c2-worldmodel/2653853/leapbot-ce/text_embeds/libero
  use_text_embed_cache: true
  context_len: 128
